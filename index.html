<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>MokTrak Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body,#wrap{width:100%;height:100%;height:100dvh;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#wrap{position:relative;isolation:isolate}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
#overlay{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:manipulation}
#hud,#fps{position:absolute;z-index:5;color:#00ff88;background:#0009;border:1px solid #00ff8844;border-radius:14px;font:600 11px monospace;padding:6px 9px;text-shadow:0 1px 3px #000}
#hud{top:10px;right:10px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fps{top:10px;left:10px}
#hint{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);display:none;background:#000c;border:1px solid #00ff88;color:#00ff88;padding:12px 18px;border-radius:20px;text-align:center;font-size:13px;max-width:85%}
#panel{position:absolute;z-index:5;right:8px;top:50%;transform:translateY(-50%);display:none;pointer-events:none;min-width:126px;max-width:150px;background:#0009;backdrop-filter:blur(4px);border:1px solid #00ff8855;border-radius:11px;padding:8px;color:#fff;font:11px ui-monospace,monospace;line-height:1.55;text-shadow:0 1px 3px #000}
#panel .title{font-weight:800;color:#00ff88;border-bottom:1px solid #00ff8844;padding-bottom:4px;margin-bottom:4px}
.row{display:flex;justify-content:space-between;gap:8px}.k{color:#00ff8899}.v{color:#fff;font-weight:700}.good{color:#00ff88}.warn{color:#ffca28}.bad{color:#ff5252}
button{font-family:system-ui,sans-serif;font-weight:700;cursor:pointer}
#startBtn{position:absolute;z-index:8;bottom:28px;left:50%;transform:translateX(-50%);border:0;border-radius:28px;background:#00ff88;color:#00180d;padding:15px 25px;font-size:16px;box-shadow:0 5px 24px #00ff8844;white-space:nowrap}
#resetBtn,#switchBtn{position:absolute;z-index:7;top:49px;border:1px solid #00ff8866;border-radius:18px;background:#001a10dd;color:#00ff88;padding:7px 11px;font-size:12px;display:none}
#resetBtn{right:10px}#switchBtn{right:66px}
#err{display:none;position:absolute;z-index:20;top:50%;left:50%;transform:translate(-50%,-50%);width:90%;max-width:440px;background:#180000f2;border:1px solid #ff5252;border-radius:12px;padding:16px;color:#ff7777;font-size:13px;line-height:1.6;white-space:pre-wrap}
#bottomNote{position:absolute;bottom:8px;left:0;right:0;z-index:4;text-align:center;color:#ffffff99;font-size:9px;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
  <div id="hud">MokTrak Pro · جاهز</div><div id="fps">-- fps</div>
  <div id="hint">المس الكائن الذي تريد تتبعه</div>
  <div id="panel"></div>
  <button id="resetBtn">إلغاء القفل ✕</button><button id="switchBtn">تبديل الكاميرا</button>
  <button id="startBtn">▶ تشغيل الكاميرا</button>
  <div id="err"></div><div id="bottomNote">التتبع تقديري؛ قد يتأثر بالإضاءة والطمس والحجب</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const video=$('video'), canvas=$('overlay'), ctx=canvas.getContext('2d',{alpha:true});
const wrap=$('wrap'), hud=$('hud'), fpsEl=$('fps'), panel=$('panel');
const startBtn=$('startBtn'), resetBtn=$('resetBtn'), switchBtn=$('switchBtn');
const hint=$('hint'), err=$('err');

const CFG={
  minScore:0.42,
  detectEveryMs:260,
  maxLostMs:1300,
  maxPredictMs:420,
  maxFeatures:90,
  minFeatures:7,
  maxFlowError:24,
  smoothing:0.72,
  reacquireRadius:1.6
};

let model=null, stream=null, running=false, facing='environment', busy=false;
let tracks=[], nextId=1, lockedId=null, selected=null;
let cvReady=false, cvLoadError=false, cvWaitStarted=0;
let prevGray=null, prevPoints=null, objectPoints=null;
let lastDetect=0, lastFrame=0, fpsN=0, fpsT=performance.now(), fps=0;
let lastDetections=[], lastGoodTrack=0, flowQuality=0;
let lockOrigin=null, lastPosition=null, lastPositionTime=0, lostSince=0;
let rafId=0, lastTap=0;

function showError(msg){err.style.display='block';err.textContent=msg}
function hideError(){err.style.display='none'}

function resize(){
  const r=wrap.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.round(r.width*dpr));
  canvas.height=Math.max(1,Math.round(r.height*dpr));
  canvas.style.width=r.width+'px';
  canvas.style.height=r.height+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,350));
resize();

function fit(){
  const r=wrap.getBoundingClientRect(), vw=video.videoWidth||640, vh=video.videoHeight||480;
  const scale=Math.max(r.width/vw,r.height/vh);
  return {scale,ox:(r.width-vw*scale)/2,oy:(r.height-vh*scale)/2,vw,vh,w:r.width,h:r.height};
}
function videoToScreen(x,y,f){return [f.ox+x*f.scale,f.oy+y*f.scale]}
function screenToVideo(clientX,clientY){
  const r=canvas.getBoundingClientRect(), f=fit();
  const sx=clientX-r.left,sy=clientY-r.top;
  return [(sx-f.ox)/f.scale,(sy-f.oy)/f.scale];
}
function clampBox(b){
  const W=video.videoWidth||640,H=video.videoHeight||480;
  const w=Math.max(8,Math.min(W,b[2])),h=Math.max(8,Math.min(H,b[3]));
  return [Math.max(0,Math.min(W-w,b[0])),Math.max(0,Math.min(H-h,b[1])),w,h];
}
function center(b){return [b[0]+b[2]/2,b[1]+b[3]/2]}
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1])}
function iou(a,b){
  const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]);
  const x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);
  const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1);
  return inter/(a[2]*a[3]+b[2]*b[3]-inter||1);
}
function median(a){
  if(!a.length)return 0;
  a.sort((x,y)=>x-y);
  const m=a.length>>1;
  return a.length%2?a[m]:(a[m-1]+a[m])/2;
}
function smoothBox(oldB,newB,alpha){
  return oldB.map((v,i)=>v*(1-alpha)+newB[i]*alpha);
}
function clearCvFrames(){
  try{if(prevGray){prevGray.delete();prevGray=null}}catch(e){}
  try{if(prevPoints){prevPoints.delete();prevPoints=null}}catch(e){}
  objectPoints=null;
}
function cvAvailable(){return cvReady&&window.cv&&cv.Mat&&video.videoWidth>0}

const frameCanvas=document.createElement('canvas');
const frameCtx=frameCanvas.getContext('2d',{willReadFrequently:true});

function makeGray(){
  if(!cvAvailable())return null;
  frameCanvas.width=video.videoWidth;
  frameCanvas.height=video.videoHeight;
  frameCtx.drawImage(video,0,0,frameCanvas.width,frameCanvas.height);
  const src=cv.imread(frameCanvas);
  const gray=new cv.Mat();
  cv.cvtColor(src,gray,cv.COLOR_RGBA2GRAY);
  src.delete();
  return gray;
}

function seedObjectPoints(gray,box){
  if(!cvAvailable()||!gray)return;
  if(prevPoints){prevPoints.delete();prevPoints=null}
  const x=Math.max(0,Math.floor(box[0])),y=Math.max(0,Math.floor(box[1]));
  const w=Math.max(1,Math.min(gray.cols-x,Math.floor(box[2])));
  const h=Math.max(1,Math.min(gray.rows-y,Math.floor(box[3])));
  if(w<8||h<8)return;
  const roi=gray.roi(new cv.Rect(x,y,w,h));
  const corners=new cv.Mat();
  try{
    cv.goodFeaturesToTrack(roi,corners,CFG.maxFeatures,0.012,4);
    if(corners.rows>=CFG.minFeatures){
      const pts=new cv.Mat(corners.rows,1,cv.CV_32FC2);
      for(let i=0;i<corners.rows;i++){
        pts.data32F[i*2]=corners.data32F[i*2]+x;
        pts.data32F[i*2+1]=corners.data32F[i*2+1]+y;
      }
      prevPoints=pts;
      objectPoints={box:box.slice(),count:corners.rows};
    }
  }catch(e){}
  roi.delete();
  corners.delete();
}

function updateOpticalFlow(gray,now){
  flowQuality=0;
  if(!cvAvailable()||!gray)return;
  if(!prevGray){
    prevGray=gray.clone();
    if(lockedId!==null&&selected)seedObjectPoints(prevGray,selected.box);
    return;
  }
  if(lockedId!==null&&selected&&prevPoints&&prevPoints.rows>=CFG.minFeatures){
    let nextPts=null,status=null,errMat=null;
    try{
      nextPts=new cv.Mat();
      status=new cv.Mat();
      errMat=new cv.Mat();
      cv.calcOpticalFlowPyrLK(
        prevGray,gray,prevPoints,nextPts,status,errMat,
        new cv.Size(21,21),3,
        new cv.TermCriteria(cv.TermCriteria_COUNT|cv.TermCriteria_EPS,30,0.01)
      );
      const dx=[],dy=[],kept=[];
      for(let i=0;i<status.rows;i++){
        if(status.data[i]!==1)continue;
        const e=errMat.data32F[i];
        if(Number.isFinite(e)&&e>CFG.maxFlowError)continue;
        const x0=prevPoints.data32F[i*2],y0=prevPoints.data32F[i*2+1];
        const x1=nextPts.data32F[i*2],y1=nextPts.data32F[i*2+1];
        if(!Number.isFinite(x1)||!Number.isFinite(y1))continue;
        if(x1 < -5||y1 < -5||x1>gray.cols+5||y1>gray.rows+5)continue;
        dx.push(x1-x0);
        dy.push(y1-y0);
        kept.push([x1,y1]);
      }
      if(kept.length>=CFG.minFeatures){
        const mx=median(dx),my=median(dy);
        const old=selected.box.slice();
        const candidate=clampBox([old[0]+mx,old[1]+my,old[2],old[3]]);
        const jump=dist(center(old),center(candidate));
        if(jump<Math.max(old[2],old[3])*0.75+25){
          selected.box=smoothBox(old,candidate,0.88);
          selected.lastSeen=now;
          selected.live=true;
          selected.velocity=[
            selected.velocity[0]*0.35+mx*0.65,
            selected.velocity[1]*0.35+my*0.65
          ];
          flowQuality=kept.length;
          const p=new cv.Mat(kept.length,1,cv.CV_32FC2);
          for(let i=0;i<kept.length;i++){
            p.data32F[i*2]=kept[i][0];
            p.data32F[i*2+1]=kept[i][1];
          }
          prevPoints.delete();
          prevPoints=p;
          objectPoints={box:selected.box.slice(),count:kept.length};
        }else{
          selected.live=false;
        }
      }else{
        selected.live=false;
      }
    }catch(e){
      selected.live=false;
    }
    if(nextPts)nextPts.delete();
    if(status)status.delete();
    if(errMat)errMat.delete();
  }
  prevGray.delete();
  prevGray=gray.clone();
  if(lockedId!==null&&selected&&(!prevPoints||prevPoints.rows<CFG.minFeatures)){
    seedObjectPoints(prevGray,selected.box);
  }
}

function resetOpticalFlow(){
  clearCvFrames();
  if(cvAvailable()){
    try{
      prevGray=makeGray();
      if(lockedId!==null&&selected)seedObjectPoints(prevGray,selected.box);
    }catch(e){}
  }
}

function matchDetectionToSelected(dets,now){
  if(!selected)return null;
  const c=center(selected.box);
  let best=null,bestScore=-Infinity;
  for(const d of dets){
    const dc=center(d.box),di=dist(c,dc);
    const norm=di/Math.max(40,Math.hypot(selected.box[2],selected.box[3]));
    const overlap=iou(selected.box,d.box);
    const areaRatio=Math.min(selected.box[2]*selected.box[3],d.box[2]*d.box[3])/
      Math.max(1,selected.box[2]*selected.box[3],d.box[2]*d.box[3]);
    const sameLabel=d.label===selected.label;
    const score=overlap*2.0+Math.max(0,1-norm)*0.8+areaRatio*0.35+(sameLabel?0.6:-0.5);
    if((sameLabel||!selected.label)&&norm<CFG.reacquireRadius&&score>bestScore){
      best=d;
      bestScore=score;
    }
  }
  return best;
}

function lockOn(t){
  lockedId=t.id;
  selected={
    id:t.id,label:t.label,score:t.score,box:t.box.slice(),
    velocity:[0,0],lastSeen:performance.now(),live:true
  };
  lockOrigin=center(t.box);
  lastPosition=center(t.box);
  lastPositionTime=performance.now();
  lostSince=0;
  resetBtn.style.display='block';
  switchBtn.style.display='block';
  panel.style.display='block';
  hint.style.display='none';
  hud.textContent='🎯 تتبع: '+selected.label;
  resetOpticalFlow();
}

function unlock(){
  lockedId=null;
  selected=null;
  lockOrigin=null;
  lastPosition=null;
  lostSince=0;
  resetBtn.style.display='none';
  switchBtn.style.display='none';
  panel.style.display='none';
  hud.textContent='MokTrak Pro · جاهز';
  resetOpticalFlow();
}

function chooseAt(clientX,clientY){
  const p=screenToVideo(clientX,clientY);
  let best=null,bestD=Infinity;
  for(const t of tracks){
    const b=t.box;
    const inside=p[0]>=b[0]&&p[0]<=b[0]+b[2]&&p[1]>=b[1]&&p[1]<=b[1]+b[3];
    const d=dist(p,center(b));
    const score=inside?d-10000:d;
    if(score<bestD){bestD=score;best=t}
  }
  if(best&&bestD<Math.max(180,Math.hypot(best.box[2],best.box[3]))){
    lockOn(best);
  }else if(lockedId!==null){
    unlock();
  }
}

canvas.addEventListener('pointerup',e=>{
  if(!running||e.target===startBtn)return;
  const now=performance.now();
  if(now-lastTap<250)return;
  lastTap=now;
  chooseAt(e.clientX,e.clientY);
});
resetBtn.addEventListener('click',e=>{e.stopPropagation();unlock()});

async function detect(now){
  if(!model||video.readyState<2)return;
  const preds=await model.detect(video,12,CFG.minScore);
  lastDetections=preds.map(p=>({
    label:p.class,score:p.score,box:p.bbox.slice(),
    lastSeen:now,velocity:[0,0],live:true
  }));
  const used=new Set(),fresh=[];
  for(const d of lastDetections){
    let best=null,scoreBest=-Infinity;
    for(const t of tracks){
      if(used.has(t.id))continue;
      const same=t.label===d.label,over=iou(t.box,d.box);
      const dc=dist(center(t.box),center(d.box))/Math.max(50,Math.hypot(t.box[2],t.box[3]));
      const s=over*1.8+Math.max(0,1-dc)*0.6+(same?0.6:-1);
      if(s>scoreBest&&same&&dc<1.5){best=t;scoreBest=s}
    }
    if(best){
      used.add(best.id);
      const b=smoothBox(best.box,d.box,0.58);
      fresh.push({...best,box:b,label:d.label,score:d.score,lastSeen:now,live:true});
    }else{
      fresh.push({...d,id:nextId++});
    }
  }
  tracks=fresh;
  if(lockedId!==null&&selected){
    const d=matchDetectionToSelected(lastDetections,now);
    if(d){
      const oldC=center(selected.box),newC=center(d.box);
      const separation=dist(oldC,newC);
      const compatible=d.label===selected.label&&
        separation<Math.max(selected.box[2],selected.box[3])*1.45+35;
      if(compatible){
        selected.box=smoothBox(selected.box,d.box,flowQuality>=CFG.minFeatures?0.28:0.72);
        selected.score=d.score;
        selected.lastSeen=now;
        selected.live=true;
        lostSince=0;
        if(!prevPoints||prevPoints.rows<CFG.minFeatures)resetOpticalFlow();
      }else if(flowQuality<CFG.minFeatures){
        selected.live=false;
        if(!lostSince)lostSince=now;
      }
    }else if(flowQuality<CFG.minFeatures){
      selected.live=false;
      if(!lostSince)lostSince=now;
    }
  }
  lastDetect=now;
}

function drawCross(cx,cy,size,live){
  ctx.save();
  ctx.strokeStyle=live?'#00ff88':'#ffca28';
  ctx.fillStyle=ctx.strokeStyle;
  ctx.shadowColor=ctx.strokeStyle;
  ctx.shadowBlur=live?9:3;
  ctx.lineWidth=2;
  const g=size*.28,a=size;
  ctx.beginPath();
  ctx.moveTo(cx-a,cy);ctx.lineTo(cx-g,cy);
  ctx.moveTo(cx+g,cy);ctx.lineTo(cx+a,cy);
  ctx.moveTo(cx,cy-a);ctx.lineTo(cx,cy-g);
  ctx.moveTo(cx,cy+g);ctx.lineTo(cx,cy+a);
  ctx.stroke();
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.arc(cx,cy,g*.9,0,Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx,cy,2,0,Math.PI*2);
  ctx.fill();
  ctx.lineWidth=2;
  for(let k=0;k<4;k++){
    const ang=k*Math.PI/2+Math.PI/4;
    ctx.beginPath();
    ctx.arc(cx,cy,a+4,ang-.18,ang+.18);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBox(b,live,label,score){
  const f=fit(),p=videoToScreen(b[0],b[1],f),q=videoToScreen(b[0]+b[2],b[1]+b[3],f);
  const x=p[0],y=p[1],w=q[0]-p[0],h=q[1]-p[1];
  ctx.save();
  ctx.strokeStyle=live?'#00ff88':'#ffca28';
  ctx.lineWidth=1.7;
  ctx.setLineDash(live?[]:[5,5]);
  ctx.shadowColor=ctx.strokeStyle;
  ctx.shadowBlur=live?6:0;
  ctx.strokeRect(x,y,w,h);
  ctx.setLineDash([]);
  const c=Math.max(5,Math.min(w,h)*.13);
  ctx.lineWidth=2.7;
  ctx.beginPath();
  ctx.moveTo(x,y+c);ctx.lineTo(x,y);ctx.lineTo(x+c,y);
  ctx.moveTo(x+w-c,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+c);
  ctx.moveTo(x+w,y+h-c);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w-c,y+h);
  ctx.moveTo(x+c,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h-c);
  ctx.stroke();
  ctx.restore();
  if(label){
    const text=(live?'● ':'◌ ')+label+' '+Math.round((score||0)*100)+'%';
    ctx.save();
    ctx.font='bold 12px monospace';
    const tw=ctx.measureText(text).width;
    const ly=Math.max(4,y-23);
    ctx.fillStyle=live?'#00ff88':'#ffca28';
    ctx.fillRect(x,ly,tw+12,21);
    ctx.fillStyle='#00140a';
    ctx.fillText(text,x+6,ly+14);
    ctx.restore();
  }
  return {cx:x+w/2,cy:y+h/2,x,y,w,h};
}

function updatePanel(now){
  if(!selected)return;
  const c=center(selected.box);
  const vx=selected.velocity[0],vy=selected.velocity[1];
  const relX=c[0]-(video.videoWidth/2),relY=c[1]-(video.videoHeight/2);
  const ox=lockOrigin?c[0]-lockOrigin[0]:0,oy=lockOrigin?c[1]-lockOrigin[1]:0;
  const speed=Math.hypot(vx,vy);
  const age=now-selected.lastSeen;
  let status=selected.live?'تتبع نشط':'استعادة المسار';
  let cls=selected.live?'good':'warn';
  if(age>CFG.maxLostMs){status='فُقد التتبع';cls='bad'}
  panel.innerHTML='<div class="title">🎯 '+selected.label+'</div>'+
    '<div class="row"><span class="k">الحالة</span><span class="'+cls+'">'+status+'</span></div>'+
    '<div class="row"><span class="k">X</span><span class="v">'+relX.toFixed(0)+'</span></div>'+
    '<div class="row"><span class="k">Y</span><span class="v">'+relY.toFixed(0)+'</span></div>'+
    '<div class="row"><span class="k">ΔX كلي</span><span class="v">'+(ox>=0?'+':'')+ox.toFixed(0)+'</span></div>'+
    '<div class="row"><span class="k">ΔY كلي</span><span class="v">'+(oy>=0?'+':'')+oy.toFixed(0)+'</span></div>'+
    '<div class="row"><span class="k">السرعة</span><span class="v">'+speed.toFixed(0)+' px/s</span></div>'+
    '<div class="row"><span class="k">نقاط بصرية</span><span class="v">'+flowQuality+'</span></div>';
  lastPosition=c;
  lastPositionTime=now;
}

function render(now){
  const r=wrap.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
  if(lockedId!==null&&selected){
    const age=now-selected.lastSeen;
    let b=selected.box.slice(),live=selected.live&&age<CFG.maxLostMs;
    if(!live&&age<=CFG.maxPredictMs){
      const dt=Math.min(CFG.maxPredictMs,age)/1000;
      b=clampBox([b[0]+selected.velocity[0]*dt,b[1]+selected.velocity[1]*dt,b[2],b[3]]);
    }
    const d=drawBox(b,live,selected.label,selected.score);
    drawCross(d.cx,d.cy,Math.max(13,Math.min(d.w,d.h)*.11),live);
    const f=fit();
    ctx.save();
    ctx.strokeStyle='#ffeb3b99';
    ctx.lineWidth=1;
    ctx.setLineDash([4,5]);
    ctx.beginPath();
    ctx.moveTo(f.w/2,f.h/2);
    ctx.lineTo(d.cx,d.cy);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle='#ffeb3b';
    ctx.beginPath();
    ctx.moveTo(f.w/2-8,f.h/2);ctx.lineTo(f.w/2+8,f.h/2);
    ctx.moveTo(f.w/2,f.h/2-8);ctx.lineTo(f.w/2,f.h/2+8);
    ctx.stroke();
    ctx.restore();
    updatePanel(now);
    if(age>CFG.maxLostMs&&!lostSince)lostSince=now;
    hud.textContent=live?'🎯 '+selected.label+' · تتبع نشط':'⚠ '+selected.label+' · محاولة الاستعادة';
  }else{
    for(const t of tracks.slice(0,6))drawBox(t.box,true,t.label,t.score);
  }
}

async function frame(){
  if(!running)return;
  const now=performance.now();
  fpsN++;
  if(now-fpsT>=1000){
    fps=fpsN*1000/(now-fpsT);
    fpsEl.textContent=fps.toFixed(0)+' fps';
    fpsN=0;
    fpsT=now;
  }
  if(video.readyState>=2&&now-lastFrame>25){
    lastFrame=now;
    if(cvAvailable()){
      try{
        const gray=makeGray();
        updateOpticalFlow(gray,now);
        if(gray)gray.delete();
      }catch(e){}
    }
    if(!busy&&model&&now-lastDetect>=CFG.detectEveryMs){
      busy=true;
      try{await detect(now)}catch(e){}
      finally{busy=false}
    }
    render(now);
  }
  rafId=requestAnimationFrame(frame);
}

function waitForOpenCV(timeout=18000){
  return new Promise(resolve=>{
    if(cvAvailable()){resolve(true);return}
    const start=performance.now();
    const poll=setInterval(()=>{
      if(window.cv&&typeof cv.Mat==='function'&&cv.imread){
        cvReady=true;
        clearInterval(poll);
        resolve(true);
      }else if(performance.now()-start>timeout){
        clearInterval(poll);
        cvLoadError=true;
        resolve(false);
      }
    },150);
  });
}

async function start(){
  startBtn.disabled=true;
  startBtn.textContent='جارٍ التحميل…';
  hideError();
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      throw new Error('الكاميرا تحتاج إلى HTTPS أو localhost. افتح الملف عبر استضافة آمنة.');
    }
    if(!window.cocoSsd||!window.tf){
      throw new Error('تعذر تحميل مكتبات اكتشاف الأجسام. تحقق من اتصال الإنترنت ثم أعد المحاولة.');
    }
    hud.textContent='تحميل نموذج اكتشاف الأجسام…';
    if(!model)model=await cocoSsd.load({base:'mobilenet_v2'});
    hud.textContent='تشغيل الكاميرا…';
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:facing},
        width:{ideal:960},
        height:{ideal:720},
        frameRate:{ideal:30,max:30}
      }
    });
    video.srcObject=stream;
    await new Promise((resolve,reject)=>{
      if(video.readyState>=1){resolve();return}
      video.onloadedmetadata=resolve;
      setTimeout(()=>reject(new Error('انتهت مهلة انتظار الكاميرا')),10000);
    });
    await video.play();
    resize();
    running=true;
    startBtn.style.display='none';
    switchBtn.style.display='block';
    hud.textContent='تحميل محرك التتبع البصري…';
    const ready=await waitForOpenCV();
    hud.textContent=ready?'MokTrak Pro · جاهز':'MokTrak · وضع الكشف الاحتياطي';
    if(!ready)hint.textContent='محرك التتبع البصري لم يُحمّل؛ سيعمل الكشف الأساسي فقط. تحقق من الإنترنت.';
    hint.style.display='block';
    setTimeout(()=>{hint.style.display='none'},5500);
    frame();
  }catch(e){
    showError('تعذر تشغيل التطبيق: '+(e.message||e)+'\n\nتأكد من السماح باستخدام الكاميرا واتصال الإنترنت. قد لا تعمل الكاميرا عند فتح الملف مباشرة من مدير الملفات؛ استخدم HTTPS.');
    hud.textContent='تعذر التشغيل';
    startBtn.disabled=false;
    startBtn.textContent='↻ إعادة المحاولة';
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream=null;
    }
  }
}

async function switchCamera(){
  if(!running)return;
  facing=facing==='environment'?'user':'environment';
  if(stream)stream.getTracks().forEach(t=>t.stop());
  running=false;
  cancelAnimationFrame(rafId);
  unlock();
  clearCvFrames();
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:facing},
        width:{ideal:960},
        height:{ideal:720},
        frameRate:{ideal:30,max:30}
      }
    });
    video.srcObject=stream;
    await video.play();
    running=true;
    lastDetect=0;
    tracks=[];
    frame();
  }catch(e){
    showError('تعذر تبديل الكاميرا: '+e.message);
    running=false;
  }
}

startBtn.addEventListener('click',start);
switchBtn.addEventListener('click',switchCamera);
window.addEventListener('pagehide',()=>{
  running=false;
  cancelAnimationFrame(rafId);
  if(stream)stream.getTracks().forEach(t=>t.stop());
  clearCvFrames();
});
window.addEventListener('error',e=>{
  if(e.message)hud.textContent='خطأ في جزء من التطبيق';
});
})();
</script>
