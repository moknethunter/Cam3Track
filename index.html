<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MokTrak · قفل وتتبع</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;font-family:system-ui,sans-serif;height:100vh}
#wrap{position:relative;width:100vw;height:100vh}
#video,#overlay{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#overlay{z-index:2;pointer-events:none}
#hud{position:absolute;top:12px;right:12px;color:#00ff88;font:600 14px monospace;
  background:rgba(0,0,0,.6);padding:8px 14px;border-radius:20px;z-index:5}
#fps{position:absolute;top:12px;left:12px;color:#00ff88;font:600 12px monospace;
  background:rgba(0,0,0,.6);padding:6px 10px;border-radius:12px;z-index:5}
#hint{position:absolute;top:55%;left:50%;transform:translate(-50%,-50%);
  color:#00ff88;font-size:16px;font-weight:700;
  background:rgba(0,0,0,.8);padding:14px 28px;border-radius:30px;
  z-index:6;display:none;pointer-events:none;border:2px solid #00ff88;
  animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
#coords{position:absolute;bottom:12px;left:12px;right:12px;
  color:#00ff88;font:500 13px ui-monospace,monospace;
  background:rgba(0,0,0,.8);padding:14px 18px;border-radius:14px;
  border:2px solid #00ff88;z-index:5;display:none;line-height:1.9;
  backdrop-filter:blur(10px)}
#coords b{color:#fff;font-weight:700}
#coords .arrow{font-size:18px;color:#fff}
#resetBtn{position:absolute;top:56px;right:12px;color:#000;
  background:#00ff88;border:none;padding:10px 18px;border-radius:22px;
  font:700 13px system-ui;z-index:7;display:none;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,255,136,.6)}
#startBtn{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  padding:18px 50px;font-size:18px;font-weight:700;background:#00ff88;color:#000;
  border:none;border-radius:40px;z-index:10;
  box-shadow:0 8px 32px rgba(0,255,136,.5)}
#startBtn:active{transform:translateX(-50%) scale(.96)}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
  <div id="hud">MokTrak · جاهز</div>
  <div id="fps">-- fps</div>
  <div id="hint">المس أي كائن لتثبيت المربع عليه</div>
  <button id="resetBtn">✕ إلغاء القفل</button>
  <div id="coords"></div>
  <button id="startBtn">▶ تشغيل الكاميرا</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
(()=>{
const MAX_TRACK   = 5;      // كم كائن نتتبع داخليًا (لإتاحة القفل)
const MAX_DISPLAY = 2;      // كم كائن نعرض (قبل القفل)
const SCORE_MIN   = 0.40;
const SMOOTHING   = 0.65;
const LOST_TIMEOUT= 800;    // ms قبل حذف مسار مفقود
const LOCK_GRACE  = 3000;   // ms نحتفظ بالقفل بعد فقد الكائن
const IOU_MIN     = 0.20;

const video=document.getElementById('video'),canvas=document.getElementById('overlay');
const ctx=canvas.getContext('2d'),hud=document.getElementById('hud');
const fpsEl=document.getElementById('fps'),startBtn=document.getElementById('startBtn');
const coordsEl=document.getElementById('coords'),hintEl=document.getElementById('hint');
const resetBtn=document.getElementById('resetBtn'),wrap=document.getElementById('wrap');

let model=null,running=false,nextId=1,tracks=[];
let lastFps=performance.now(),fpsCount=0;
let lockedId=null,lockInfo=null,lockedLastSeen=0;

// ─── أدوات ───
const iou=(a,b)=>{const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);const i=Math.max(0,x2-x1)*Math.max(0,y2-y1),u=a[2]*a[3]+b[2]*b[3]-i;return u>0?i/u:0};
const smooth=(p,n)=>{const a=SMOOTHING,b=1-SMOOTHING;return[p[0]*a+n[0]*b,p[1]*a+n[1]*b,p[2]*a+n[2]*b,p[3]*a+n[3]*b]};
const fmt=(n)=>(n>=0?'+':'')+n.toFixed(0);
const dirArrow=(dx,dy)=>{
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax<2&&ay<2)return'•';
  if(ay>ax*1.5)return dy<0?'↑':'↓';
  if(ax>ay*1.5)return dx<0?'←':'→';
  return (dy<0?'↑':'↓')+(dx<0?'←':'→')||((dx<0)?'↖':'↗');
};

// ─── التشغيل ───
async function start(){
  startBtn.disabled=true;hud.textContent='تحميل الموديل…';
  try{
    model=await cocoSsd.load({base:'lite_mobilenet_v2'});
    hud.textContent='تشغيل الكاميرا…';
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream;
    await new Promise(r=>{video.onloadedmetadata=r});
    await video.play();
    canvas.width=video.videoWidth;canvas.height=video.videoHeight;
    startBtn.style.display='none';hud.textContent='MokTrak · يعمل';
    running=true;
    setTimeout(()=>{if(!lockedId){hintEl.style.display='block';setTimeout(()=>hintEl.style.display='none',4000)}},1500);
    loop();
  }catch(e){
    hud.textContent='خطأ: '+e.message;
    startBtn.disabled=false;startBtn.textContent='↻ إعادة المحاولة';
  }
}

// ─── اللمس للقفل ───
function screenToCanvas(clientX,clientY){
  const r=wrap.getBoundingClientRect();
  const wrapW=r.width,wrapH=r.height;
  const scale=Math.max(wrapW/canvas.width,wrapH/canvas.height);
  const rw=canvas.width*scale,rh=canvas.height*scale;
  const ox=(wrapW-rw)/2,oy=(wrapH-rh)/2;
  return [(clientX-r.left-ox)/scale,(clientY-r.top-oy)/scale];
}

wrap.addEventListener('click',(e)=>{
  if(!running)return;
  if(e.target===startBtn||e.target===resetBtn)return;
  const [tx,ty]=screenToCanvas(e.clientX,e.clientY);
  // ابحث عن أقرب كائن
  let best=null,bestD=Infinity;
  for(const t of tracks){
    const [x,y,w,h]=t.box;
    const cx=x+w/2,cy=y+h/2;
    const d=Math.hypot(cx-tx,cy-ty);
    const inside=tx>=x&&tx<=x+w&&ty>=y&&ty<=y+h;
    const score=inside?d-1000:d; // الكائنات التي تحت الإصبع أولى
    if(score<bestD){bestD=score;best=t}
  }
  if(best&&bestD<300){
    lockedId=best.id;
    const [x,y,w,h]=best.box;
    lockInfo={startX:x,startY:y,startW:w,startH:h,
      prevX:x,prevY:y,prevW:w,prevH:h,prevTime:performance.now()};
    lockedLastSeen=performance.now();
    hud.textContent='🎯 مقفل على: '+best.label;
    resetBtn.style.display='block';
    coordsEl.style.display='block';
    hintEl.style.display='none';
  }else{
    unlock();
  }
});

function unlock(){
  lockedId=null;lockInfo=null;
  resetBtn.style.display='none';
  coordsEl.style.display='none';
  hud.textContent='MokTrak · يعمل';
}
resetBtn.addEventListener('click',(e)=>{e.stopPropagation();unlock()});

// ─── الحلقة ───
async function loop(){
  if(!running)return;
  const now=performance.now();
  fpsCount++;
  if(now-lastFps>=1000){fpsEl.textContent=fpsCount+' fps';fpsCount=0;lastFps=now}

  let preds=[];
  try{preds=await model.detect(video,10,SCORE_MIN)}catch(_){}

  const dets=preds.map(p=>({label:p.class,score:p.score,box:p.bbox,area:p.bbox[2]*p.bbox[3]}))
    .sort((a,b)=>b.area-a.area).slice(0,MAX_TRACK);

  // مطابقة مع المسارات السابقة
  const used=new Array(tracks.length).fill(false),fresh=[];
  for(const d of dets){
    let bi=-1,biou=IOU_MIN;
    for(let i=0;i<tracks.length;i++){
      if(used[i])continue;
      const v=iou(tracks[i].box,d.box);
      if(v>biou){biou=v;bi=i}
    }
    if(bi>=0){
      used[bi]=true;const t=tracks[bi];
      fresh.push({id:t.id,box:smooth(t.box,d.box),label:d.label,score:d.score,lastSeen:now});
    }else{
      fresh.push({id:nextId++,box:[...d.box],label:d.label,score:d.score,lastSeen:now});
    }
  }
  for(let i=0;i<tracks.length;i++){
    if(!used[i]&&now-tracks[i].lastSeen<LOST_TIMEOUT)fresh.push(tracks[i]);
  }
  tracks=fresh;

  // تحقق من القفل
  let locked=null;
  if(lockedId!==null){
    locked=tracks.find(t=>t.id===lockedId);
    if(locked){lockedLastSeen=now}
    else if(now-lockedLastSeen>LOCK_GRACE){unlock()}
  }

  // ─── الرسم ───
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // اختيار ما يُعرض
  let toDraw=[];
  if(lockedId!==null&&locked){toDraw=[locked]}
  else if(lockedId!==null&&!locked){
    // الكائن مفقود مؤقتًا — أظهر آخر موضع معطّل
    toDraw=[];
  }else{
    toDraw=tracks.slice(0,MAX_DISPLAY);
  }

  for(const t of toDraw){
    const [x,y,w,h]=t.box;
    const isLocked=t.id===lockedId;

    // ظل خلفي
    ctx.shadowColor='#00ff88';
    ctx.shadowBlur=isLocked?20:10;
    ctx.strokeStyle='#00ff88';
    ctx.lineWidth=isLocked?7:4;
    ctx.strokeRect(x,y,w,h);
    ctx.shadowBlur=0;

    // زوايا مُقوّاة
    const cl=Math.min(w,h)*0.18;
    ctx.lineWidth=isLocked?9:6;
    ctx.beginPath();
    ctx.moveTo(x,y+cl);ctx.lineTo(x,y);ctx.lineTo(x+cl,y);
    ctx.moveTo(x+w-cl,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+cl);
    ctx.moveTo(x+w,y+h-cl);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w-cl,y+h);
    ctx.moveTo(x+cl,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h-cl);
    ctx.stroke();

    // علامة القفل
    if(isLocked){
      const cx=x+w/2,cy=y+h/2;
      ctx.beginPath();
      ctx.arc(cx,cy,4,0,Math.PI*2);
      ctx.fillStyle='#00ff88';
      ctx.fill();
      // خطوط اتجاه من المركز
      ctx.strokeStyle='rgba(0,255,136,.4)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(x,cy);ctx.lineTo(x+w,cy);
      ctx.moveTo(cx,y);ctx.lineTo(cx,y+h);
      ctx.stroke();
    }

    // لافتة
    const text=`${isLocked?'🎯 ':''}#${t.id} ${t.label} ${(t.score*100).toFixed(0)}%`;
    ctx.font='bold 16px monospace';
    const tw=ctx.measureText(text).width;
    ctx.fillStyle='#00ff88';
    ctx.fillRect(x,y-28,tw+16,28);
    ctx.fillStyle='#000';
    ctx.fillText(text,x+8,y-9);
  }

  // ─── لوحة الإحداثيات ───
  if(lockedId!==null&&lockInfo&&locked){
    const [x,y,w,h]=locked.box;
    const cx=x+w/2,cy=y+h/2;
    const dt=Math.max(1,now-lockInfo.prevTime);
    const dx=x-lockInfo.prevX;
    const dy=y-lockInfo.prevY;
    const dw=w-lockInfo.prevW;
    const dh=h-lockInfo.prevH;
    const totalDx=x-lockInfo.startX;
    const totalDy=y-lockInfo.startY;
    const totalDw=w-lockInfo.startW;
    const totalDh=h-lockInfo.startH;
    const vx=(dx/dt*1000).toFixed(0);
    const vy=(dy/dt*1000).toFixed(0);

    coordsEl.innerHTML=
      `<b>🎯 ${locked.label}</b> · ثقة ${(locked.score*100).toFixed(0)}%<br>`+
      `📍 الموضع: (${x.toFixed(0)}، ${y.toFixed(0)})  ·  الحجم: ${w.toFixed(0)}×${h.toFixed(0)}<br>`+
      `🎯 المركز: (${cx.toFixed(0)}، ${cy.toFixed(0)})  ·  المساحة: ${(w*h/1000).toFixed(1)}k<br>`+
      `<span class="arrow">${dirArrow(dx,dy)}</span> `+
      `الحركة: X ${fmt(dx)} · Y ${fmt(dy)}  ·  الحجم: ${fmt(dw)}/${fmt(dh)}<br>`+
      `⚡ السرعة: ${vx}px/s · ${vy}px/s<br>`+
      `📊 من القفل: ΔX ${fmt(totalDx)} · ΔY ${fmt(totalDy)} · ΔW ${fmt(totalDw)} · ΔH ${fmt(totalDh)}`;

    lockInfo.prevX=x;lockInfo.prevY=y;lockInfo.prevW=w;lockInfo.prevH=h;
    lockInfo.prevTime=now;
  }

  requestAnimationFrame(loop);
}
startBtn.addEventListener('click',start);
})();
</script>
</body>
</html>
